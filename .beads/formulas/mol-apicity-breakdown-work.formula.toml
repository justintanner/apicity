# Break incoming Apicity provider/API requests into concrete implementation beads.
description = """
Apicity incoming-work breakdown formula -- convert an incoming provider,
endpoint, model, or API-surface request into ready-to-claim child beads.

This formula sits above `mol-add-endpoint`. Use it when the incoming work is
larger than one known endpoint, such as a provider docs page, pasted OpenAPI
fragment, model rollout, or mixed feature request. The output should be a
small dependency graph of unassigned implementation beads that polecats can
pick up one by one from `apicity/gastown.polecat`.

Key rules encoded in the workflow:
  - Preserve pool pickup behavior: child beads are not assigned directly.
    They get `metadata.gc.routed_to = route_target`.
  - Make each child bead startable without rereading the original request.
  - Keep endpoint work to one upstream operation per implementation bead and
    one endpoint per PR.
  - Require HAR-backed integration tests and recordings for any child whose
    behavior touches an upstream API.
  - Add dependency edges so scaffold/shared work blocks endpoint/model work,
    and final validation/docs work waits for implementation children.

## Variables

| Variable         | Source | Default                  | Description |
|------------------|--------|--------------------------|-------------|
| tracking_bead    | caller | -                        | Incoming/request bead this graph is derived from. |
| provider         | caller | -                        | Provider/package slug, e.g. openai, kie, fal, xai. |
| spec_source      | caller | -                        | Upstream docs URL, spec URL, file path, or pasted source summary. |
| target_surface   | caller | -                        | Desired SDK surface, package, method path, or export area. |
| operations_json  | caller | []                       | JSON array of concrete operations/models to fan out. |
| endpoint_names   | caller | ""                       | Human-readable endpoint list when a normalized JSON plan is not ready. |
| model_names      | caller | ""                       | Human-readable model list when relevant. |
| scaffold_summary | caller | ""                       | Shared scaffold/schema/helper work needed before children. |
| priority         | caller | 2                        | Priority for generated child beads. |
| labels           | caller | apicity,breakdown        | Extra comma-separated labels for generated child beads. |
| route_target     | caller | apicity/gastown.polecat  | Pool route stored in metadata.gc.routed_to. |
| dry_run          | caller | true                     | "true" previews creates; "false" creates beads and dependencies. |

`operations_json` is optional, but concrete operation entries produce the best
child beads. Recommended shape:

```json
[
  {
    "kind": "endpoint",
    "name": "Create response",
    "method": "POST",
    "path": "/v1/responses",
    "docs_url": "https://platform.openai.com/docs/api-reference/responses/create",
    "surface": "openai.v1.responses.create()",
    "notes": "Mirror chat completion request typing where possible.",
    "requires_har": true,
    "needs_scaffold": true
  },
  {
    "kind": "model",
    "name": "gpt-4.1",
    "surface": "model constants or examples",
    "docs_url": "https://platform.openai.com/docs/models",
    "notes": "No endpoint code unless examples need refresh.",
    "requires_har": false
  }
]
```

Run with `dry_run=true` first. Re-run with `dry_run=false` only after the
preview shows concrete titles, descriptions, acceptance criteria, route
metadata, and dependency edges.
"""
formula = "mol-apicity-breakdown-work"
version = 1

[vars]
[vars.tracking_bead]
description = "Incoming/request bead that explains the work being broken down."
required = true

[vars.provider]
description = "Provider package slug, e.g. openai, kie, fal, xai."
required = true

[vars.spec_source]
description = "Upstream docs URL, spec URL, local spec path, or pasted source summary."
required = true

[vars.target_surface]
description = "Desired SDK surface, package area, method path, or export area."
required = true

[vars.operations_json]
description = "JSON array of concrete endpoint/model operations to create implementation beads for."
default = "[]"

[vars.endpoint_names]
description = "Human-readable endpoint names when operations_json is not normalized yet."
default = ""

[vars.model_names]
description = "Human-readable model names when relevant."
default = ""

[vars.scaffold_summary]
description = "Shared scaffold/schema/helper work that must block endpoint/model children."
default = ""

[vars.priority]
description = "Priority for generated child beads."
default = "2"

[vars.labels]
description = "Extra comma-separated labels for generated child beads."
default = "apicity,breakdown"

[vars.route_target]
description = "Pool route stored in metadata.gc.routed_to; do not set assignee."
default = "apicity/gastown.polecat"

[vars.dry_run]
description = "Preview creates when true; create beads and deps when false."
default = "true"

[[steps]]
id = "load-context"
title = "Load request context and validate inputs"
description = """
Prime the workspace and read the incoming/request bead before creating child
work. Do not assign child beads directly to an agent.

```bash
bd prime
bd show {{tracking_bead}}
bd show {{tracking_bead}} --json | jq '.[0].metadata'
```

Review the incoming request against these inputs:

```text
provider={{provider}}
spec_source={{spec_source}}
target_surface={{target_surface}}
endpoint_names={{endpoint_names}}
model_names={{model_names}}
scaffold_summary={{scaffold_summary}}
route_target={{route_target}}
dry_run={{dry_run}}
```

Validate the operation plan if one was supplied:

```bash
cat > /tmp/apicity-breakdown-ops.json <<'JSON'
{{operations_json}}
JSON
node - <<'NODE'
import { readFileSync } from "node:fs";

const raw = readFileSync("/tmp/apicity-breakdown-ops.json", "utf8").trim();
const operations = raw ? JSON.parse(raw) : [];
if (!Array.isArray(operations)) {
  throw new Error("operations_json must be a JSON array");
}

for (const [index, op] of operations.entries()) {
  if (!op || typeof op !== "object") {
    throw new Error(`operation ${index} must be an object`);
  }
  if (!op.name || !op.kind) {
    throw new Error(`operation ${index} requires kind and name`);
  }
  if (op.kind === "endpoint") {
    for (const field of ["method", "path", "docs_url"]) {
      if (!op[field]) {
        throw new Error(`endpoint operation ${index} requires ${field}`);
      }
    }
  }
}

console.log(`operations: ${operations.length}`);
NODE
```

**Exit criteria:** The tracking bead and inputs are understood, and any
provided operation plan parses cleanly."""

[[steps]]
id = "normalize-plan"
title = "Normalize inventory before fan-out"
needs = ["load-context"]
description = """
Turn the incoming request into a concrete fan-out plan. If
`operations_json` is empty, this formula will create exactly one inventory
child bead. That bead should produce the concrete `operations_json` for a
second run of this formula.

For endpoint operations, include at least:
  - `kind: "endpoint"`
  - `name`
  - `method`
  - `path`
  - `docs_url`
  - `surface`
  - `requires_har: true` unless the endpoint has no upstream call path

For model/export/doc-only work, include:
  - `kind: "model"` or `kind: "docs"`
  - `name`
  - `surface`
  - `docs_url` when available
  - `requires_har: false` unless implementation touches upstream APIs

Put shared provider setup in `scaffold_summary` instead of duplicating it on
each endpoint. Endpoint/model child beads will depend on the scaffold bead.

**Exit criteria:** The plan is either concrete enough to create child beads,
or the generated inventory bead will have enough detail to normalize it."""

[[steps]]
id = "preview-child-graph"
title = "Preview child beads and dependency graph"
needs = ["normalize-plan"]
description = """
Run the create script with `dry_run=true` first. The preview must show
specific titles, descriptions, acceptance criteria, route metadata, and
dependency intent. It must not set `assignee`.

```bash
bd cook mol-apicity-breakdown-work \
  --var tracking_bead={{tracking_bead}} \
  --var provider={{provider}} \
  --var spec_source='{{spec_source}}' \
  --var target_surface='{{target_surface}}' \
  --var operations_json='{{operations_json}}' \
  --var endpoint_names='{{endpoint_names}}' \
  --var model_names='{{model_names}}' \
  --var scaffold_summary='{{scaffold_summary}}' \
  --var priority={{priority}} \
  --var labels='{{labels}}' \
  --var route_target={{route_target}} \
  --var dry_run=true \
  --dry-run
```

**Exit criteria:** The preview is concrete enough for workers and preserves
pool pickup behavior."""

[[steps]]
id = "create-child-beads"
title = "Create unassigned routed child beads"
needs = ["preview-child-graph"]
description = """
Create the child bead graph. Keep `dry_run=true` until the preview is
correct; set `dry_run=false` to create beads and dependency edges.

```bash
cat > /tmp/apicity-breakdown-ops.json <<'JSON'
{{operations_json}}
JSON
cat > /tmp/apicity-breakdown-tracking-bead.txt <<'TEXT'
{{tracking_bead}}
TEXT
cat > /tmp/apicity-breakdown-provider.txt <<'TEXT'
{{provider}}
TEXT
cat > /tmp/apicity-breakdown-spec-source.txt <<'TEXT'
{{spec_source}}
TEXT
cat > /tmp/apicity-breakdown-target-surface.txt <<'TEXT'
{{target_surface}}
TEXT
cat > /tmp/apicity-breakdown-endpoint-names.txt <<'TEXT'
{{endpoint_names}}
TEXT
cat > /tmp/apicity-breakdown-model-names.txt <<'TEXT'
{{model_names}}
TEXT
cat > /tmp/apicity-breakdown-scaffold-summary.txt <<'TEXT'
{{scaffold_summary}}
TEXT
cat > /tmp/apicity-breakdown-priority.txt <<'TEXT'
{{priority}}
TEXT
cat > /tmp/apicity-breakdown-labels.txt <<'TEXT'
{{labels}}
TEXT
cat > /tmp/apicity-breakdown-route-target.txt <<'TEXT'
{{route_target}}
TEXT
cat > /tmp/apicity-breakdown-dry-run.txt <<'TEXT'
{{dry_run}}
TEXT

node - <<'NODE'
import { readFileSync } from "node:fs";
import { spawnSync } from "node:child_process";

function readText(path) {
  return readFileSync(path, "utf8").trim();
}

const trackingBead = readText("/tmp/apicity-breakdown-tracking-bead.txt");
const provider = readText("/tmp/apicity-breakdown-provider.txt");
const specSource = readText("/tmp/apicity-breakdown-spec-source.txt");
const targetSurface = readText("/tmp/apicity-breakdown-target-surface.txt");
const endpointNames = readText("/tmp/apicity-breakdown-endpoint-names.txt");
const modelNames = readText("/tmp/apicity-breakdown-model-names.txt");
const scaffoldSummary = readText("/tmp/apicity-breakdown-scaffold-summary.txt");
const priority = readText("/tmp/apicity-breakdown-priority.txt");
const labels = readText("/tmp/apicity-breakdown-labels.txt")
  .split(",")
  .map((label) => label.trim())
  .filter(Boolean);
const routeTarget = readText("/tmp/apicity-breakdown-route-target.txt");
const dryRun = readText("/tmp/apicity-breakdown-dry-run.txt") !== "false";

const raw = readFileSync("/tmp/apicity-breakdown-ops.json", "utf8").trim();
const operations = raw ? JSON.parse(raw) : [];

function run(args) {
  const result = spawnSync("bd", args, {
    encoding: "utf8",
    stdio: ["ignore", "pipe", "pipe"],
  });
  if (result.stdout) {
    process.stdout.write(result.stdout);
  }
  if (result.stderr) {
    process.stderr.write(result.stderr);
  }
  if (result.status !== 0) {
    throw new Error(`bd ${args.join(" ")} failed with ${result.status}`);
  }
  return result.stdout.trim();
}

function parseId(output) {
  const parsed = JSON.parse(output);
  if (Array.isArray(parsed)) {
    return parsed[0]?.id;
  }
  return parsed.id;
}

function labelSet(...extra) {
  return [...new Set([...labels, "provider:" + provider, ...extra])]
    .filter(Boolean)
    .join(",");
}

function metadata(kind, extra = {}) {
  return JSON.stringify({
    "gc.routed_to": routeTarget,
    "apicity.breakdown.tracking_bead": trackingBead,
    "apicity.breakdown.provider": provider,
    "apicity.breakdown.kind": kind,
    ...extra,
  });
}

function createIssue({ key, title, description, acceptance, kind, type }) {
  const args = [
    "create",
    title,
    "--type",
    type ?? "task",
    "--priority",
    priority,
    "--labels",
    labelSet(kind),
    "--deps",
    "discovered-from:" + trackingBead,
    "--metadata",
    metadata(kind),
    "--description",
    description,
    "--acceptance",
    acceptance,
    "--json",
  ];
  if (dryRun) {
    args.splice(args.length - 1, 0, "--dry-run");
  }
  const output = run(args);
  return dryRun ? `<dry-run:${key}>` : parseId(output);
}

function addBlocker(blockerId, blockedId) {
  if (dryRun) {
    console.log(`DRY RUN: dependency ${blockerId} blocks ${blockedId}`);
    return;
  }
  run(["dep", blockerId, "--blocks", blockedId]);
}

function endpointDescription(op) {
  return [
    `Provider: ${provider}`,
    `Source: ${specSource}`,
    `Target SDK surface: ${op.surface || targetSurface}`,
    `Operation: ${op.method} ${op.path}`,
    `Docs: ${op.docs_url}`,
    "",
    op.notes ? `Context: ${op.notes}` : "Context: See source docs/spec.",
    "",
    "Implementation guidance:",
    "- Use `mol-add-endpoint` when the operation maps to one endpoint.",
    "- Keep this to one upstream operation and one PR.",
    "- Mirror existing provider patterns for types, schema, factory wiring,",
    "  endpoint URL comments, and `scripts/endpoint-docs.tsv`.",
    "- Add or update HAR-backed integration coverage when the endpoint",
    "  touches upstream APIs.",
    "",
    "Useful command after claiming this bead:",
    "`bd cook mol-add-endpoint --var provider=" +
      provider +
      " --var method=" +
      op.method +
      " --var endpoint_path=" +
      op.path +
      " --var docs_url=" +
      op.docs_url +
      " --var bead=<this-bead>`",
  ].join("\\n");
}

function endpointAcceptance(op) {
  const har = op.requires_har === false
    ? "- If no upstream call path is touched, document why no HAR is needed."
    : "- Add/record a Polly HAR fixture with `pnpm run dev:record -- <test>` and verify replay with `pnpm run test:run <test>`.";
  return [
    `- ${op.method} ${op.path} is exposed at ${op.surface || targetSurface}.`,
    "- Request/response types and schemas follow local provider patterns.",
    "- Factory wiring includes the required URL and docs comments.",
    "- `scripts/endpoint-docs.tsv` includes the matching endpoint row.",
    har,
    "- Focused provider tests and lint pass before handoff.",
  ].join("\\n");
}

function genericDescription(op) {
  return [
    `Provider: ${provider}`,
    `Source: ${specSource}`,
    `Target surface: ${op.surface || targetSurface}`,
    `Work item: ${op.name}`,
    op.docs_url ? `Docs: ${op.docs_url}` : "",
    "",
    op.notes ? `Context: ${op.notes}` : "Context: See source docs/spec.",
    "",
    "Keep this bead scoped to the named model/export/docs unit. If it",
    "turns into endpoint implementation, split endpoint work into separate",
    "one-operation beads before coding.",
  ].filter(Boolean).join("\\n");
}

function genericAcceptance(op) {
  const har = op.requires_har
    ? "- HAR-backed integration coverage is added or refreshed because upstream API behavior changed."
    : "- No HAR is required unless the implementation starts touching upstream API behavior.";
  return [
    "- The named surface is implemented or documented with local conventions.",
    "- Exports, examples, docs, or registry entries are updated as needed.",
    har,
    "- Focused checks pass before handoff.",
  ].join("\\n");
}

let scaffoldId;
if (scaffoldSummary || operations.some((op) => op.needs_scaffold)) {
  scaffoldId = createIssue({
    key: "scaffold",
    kind: "scaffold",
    title: `Prepare ${provider} shared scaffold for incoming API work`,
    description: [
      `Provider: ${provider}`,
      `Source: ${specSource}`,
      `Target surface: ${targetSurface}`,
      "",
      scaffoldSummary || "Create shared types/helpers/schema needed by the planned operations.",
      "",
      "Keep this bead limited to shared groundwork. Endpoint-specific wiring",
      "belongs in one-operation implementation beads.",
    ].join("\\n"),
    acceptance: [
      "- Shared provider scaffolding is in place before endpoint/model beads run.",
      "- No endpoint-specific behavior is implemented here unless required to unblock all children.",
      "- Follow-up child beads have enough context to start independently.",
      "- Focused checks pass before handoff.",
    ].join("\\n"),
  });
}

const implementationIds = [];
if (operations.length === 0) {
  createIssue({
    key: "inventory",
    kind: "inventory",
    title: `Normalize ${provider} incoming API work into endpoint/model beads`,
    description: [
      `Provider: ${provider}`,
      `Source: ${specSource}`,
      `Target surface: ${targetSurface}`,
      endpointNames ? `Endpoint names: ${endpointNames}` : "",
      modelNames ? `Model names: ${modelNames}` : "",
      "",
      "Produce a concrete operations_json plan with one endpoint/model per",
      "future implementation bead. Include method, path, docs_url, surface,",
      "HAR requirement, scaffold needs, and notes for each operation.",
    ].filter(Boolean).join("\\n"),
    acceptance: [
      "- A normalized operations_json plan is attached to the tracking bead or notes.",
      "- Endpoint entries are one upstream operation each.",
      "- Shared scaffold needs are separated from endpoint-specific work.",
      "- HAR-backed test expectations are marked per child operation.",
      "- The next formula run can create ready-to-claim implementation beads.",
    ].join("\\n"),
  });
} else {
  for (const op of operations) {
    const isEndpoint = op.kind === "endpoint";
    const id = createIssue({
      key: op.name,
      kind: isEndpoint ? "endpoint" : op.kind,
      type: isEndpoint ? "feature" : "task",
      title: isEndpoint
        ? `Add ${provider} ${op.method} ${op.path} endpoint`
        : `Add ${provider} ${op.name} ${op.kind} work`,
      description: isEndpoint ? endpointDescription(op) : genericDescription(op),
      acceptance: isEndpoint ? endpointAcceptance(op) : genericAcceptance(op),
    });
    if (id) {
      implementationIds.push(id);
      if (scaffoldId) {
        addBlocker(scaffoldId, id);
      }
    }
  }
}

if (implementationIds.length > 0) {
  const finalId = createIssue({
    key: "validation",
    kind: "validation",
    title: `Validate ${provider} incoming-work implementation set`,
    description: [
      `Provider: ${provider}`,
      `Source: ${specSource}`,
      `Target surface: ${targetSurface}`,
      "",
      "Run after the implementation children are complete. Check docs,",
      "generated examples, endpoint registry/export consistency, and",
      "harness/Telegram readiness for changed recordings.",
    ].join("\\n"),
    acceptance: [
      "- Relevant provider build/test checks pass.",
      "- `pnpm run lint` or focused formula-validation checks pass.",
      "- Changed endpoint recordings have `pnpm run harness:telegram -- --dry-run` reviewed when applicable.",
      "- Docs/generated examples/MCP registry or exports are verified where touched.",
      "- Any remaining follow-up is filed as a linked bead.",
    ].join("\\n"),
  });
  if (finalId) {
    for (const id of implementationIds) {
      addBlocker(id, finalId);
    }
  }
}

if (!dryRun) {
  run(["dep", "cycles"]);
}
NODE
```

**Exit criteria:** With `dry_run=false`, child beads exist, are unassigned,
carry `metadata.gc.routed_to={{route_target}}`, and have dependency edges."""

[[steps]]
id = "verify-routing-and-readiness"
title = "Verify child routing and readiness"
needs = ["create-child-beads"]
description = """
Verify the created graph. Child beads should be unassigned and routed to the
pool through metadata, not directly assigned.

```bash
bd dep tree {{tracking_bead}}
bd ready --json | jq '[.[] | select((.metadata["gc.routed_to"] // "") == "{{route_target}}")] | map({id,title,status,assignee,route:.metadata["gc.routed_to"]})'
bd dep cycles
```

For each created child bead, spot-check:

```bash
bd show <child-id>
bd show <child-id> --json | jq '.[0] | {id,title,status,assignee,metadata,acceptance_criteria}'
```

Expected state:
  - `assignee` is empty.
  - `metadata.gc.routed_to` is `{{route_target}}`.
  - descriptions include provider, source docs/spec, target surface, and
    concrete operation/model context.
  - endpoint children mention HAR-backed record/replay requirements.
  - dependency edges block endpoint/model work on scaffold work when present.

**Exit criteria:** The graph is ready for pool pickup and no child bead is a
vague placeholder."""

[[steps]]
id = "handoff"
title = "Record summary on the tracking bead"
needs = ["verify-routing-and-readiness"]
description = """
Update the incoming/request bead with a concise summary of the generated
graph. Do not close implementation child beads here.

```bash
bd update {{tracking_bead}} \
  --notes "Breakdown complete: created routed child beads for {{provider}} incoming work; route_target={{route_target}}"
bd dolt push
```

If you only ran a dry-run, record that instead:

```bash
bd update {{tracking_bead}} \
  --notes "Breakdown dry-run complete for {{provider}} incoming work; rerun with dry_run=false after reviewing the preview"
```

**Exit criteria:** The tracking bead explains whether this was a dry-run or a
real graph creation, and child work remains available through the pool."""
