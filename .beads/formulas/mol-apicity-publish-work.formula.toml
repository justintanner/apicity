description = """
Work formula with explicit publish step.

Like a direct do-work lifecycle, but adds a 'publish' step between do-work
and drain so ephemeral pool workers commit beads bookkeeping, pull --rebase,
and push their work to the remote before exiting. Without this step, work
commits end up stranded on the worker's local clone.

Use this for short-lived pool workers (e.g. ac/kimi2p6) that don't need
branch isolation but DO need to publish their commits.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| issue | caller | The work bead ID assigned to this agent |
"""
formula = "mol-apicity-publish-work"
version = 1
# Requiring formula_compiler >=2.0.0 compiles this as a v2 graph, giving the recipe a
# Ready-visible workflow root (gc.kind=workflow on the root step), so `gc sling --formula`
# to a scale-from-zero pool wakes a worker instead of being rejected as a molecule
# container. (Replaces the deprecated `contract = "graph.v2"`.)
[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.issue]
description = "The work bead ID assigned to this agent"
required = true

[[steps]]
id = "do-work"
title = "Read assignment, implement, and close"
description = """
You have been assigned a work bead. Read it, do the work, and close it.

**1. Read your assignment:**
```bash
bd show {{issue}}
```

Read the bead's title and description carefully. This is your task.

**2. Implement the solution:**

Do exactly what the bead describes. Follow existing codebase conventions.
Make atomic, focused commits as you work:
```bash
git add <files>
git commit -m "<type>: <description>"
```

**3. Close the bead when done:**
```bash
bd update {{issue}} --status=closed --notes "Done: <brief summary of what you did>"
```

If you get stuck or need clarification, check your inbox:
```bash
gc mail inbox
```

**Exit criteria:** The work described in the bead is complete and the bead is closed."""

[[steps]]
id = "publish"
title = "Publish work to remote"
needs = ["do-work"]
description = """
Your code changes are committed locally but not yet on the remote. Publish
them so they're not stranded on this ephemeral worker.

**1. Stage and commit any beads bookkeeping churn:**

`bd close` and other bd writes export to `.beads/issues.jsonl`, which often
ends up staged-but-uncommitted. Sweep it into a chore commit:

```bash
git add .beads/issues.jsonl
git diff --cached --quiet || git commit -m "chore(beads): close {{issue}}"
```

**2. Pull any new commits from the remote and rebase your work on top:**

```bash
git pull --rebase
```

If the rebase fails because of conflicts, resolve them and `git rebase --continue`.
Do NOT `git rebase --abort` and give up — your commits would be stranded.

**3. Push to the remote:**

```bash
git push
```

If the push is rejected as non-fast-forward, run `git pull --rebase` and
`git push` again. Repeat until it succeeds.

**4. (Optional) Push beads to Dolt remote if one is configured:**

```bash
bd dolt push 2>/dev/null || true
```

This is best-effort; ignore failure if no dolt remote is set up.

**Exit criteria:** `git status` shows the working tree clean and on a branch
that is up to date with its remote tracking branch."""

[[steps]]
id = "drain"
title = "Signal completion"
needs = ["publish"]
description = """
Work is done and pushed. Signal the controller to reclaim this session:

```bash
gc runtime drain-ack
```

Run this command and nothing else."""
