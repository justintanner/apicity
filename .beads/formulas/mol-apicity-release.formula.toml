description = """
Apicity npm release formula — cut a release of @apicity/* packages from the
`stable` branch to the npm registry.

Branch model:
  - main   = agents work here (feature work lands here first)
  - stable = release branch; releases cut from stable; tags pushed to stable

The formula publishes 19 scoped packages in one go: 18 providers under
packages/provider/* plus packages/mcp-server. All ship under one version
and one dist-tag (alpha / beta / next / latest).

The `publish` step uses the `NPM_TOKEN` item in the `apicity` 1Password vault
(`op://apicity/NPM_TOKEN/password`) through a temporary npm user config. The
token must have publish access for the `@apicity` scope.

## Variables

| Variable     | Source | Default | Description                                    |
|--------------|--------|---------|------------------------------------------------|
| version      | caller | —       | Semver to publish, e.g. 0.1.0-alpha.1          |
| dist_tag     | caller | alpha   | npm dist-tag (alpha / beta / next / latest)    |
| dry_run      | caller | false   | If "true", stop after publish-dry-run          |
| release_bead | caller | —       | Tracking bead this release closes              |
"""
formula = "mol-apicity-release"
version = 1

[vars]
[vars.version]
description = "Semver string to publish, e.g. 0.1.0-alpha.1. Must be a valid pre-release identifier when dist_tag != latest."
required = true

[vars.dist_tag]
description = "npm dist-tag for this release (alpha / beta / next / latest). Use alpha for pre-1.0."
default = "alpha"

[vars.dry_run]
description = 'If "true", stop after publish-dry-run; do not run real publish or git push.'
default = "false"

[vars.release_bead]
description = "The tracking bead this release is closing. Closed in the final step."
required = true

[[steps]]
id = "load-context"
title = "Load context and verify clean working tree"
description = """
Initialize the session and verify the repo is in a publishable state.

**1. Prime your environment:**
```bash
bd prime
```

**2. Read the release bead and plan:**
```bash
bd show {{release_bead}}
cat /Users/jwt/apicity/RELEASE.md   # release process doc (if present)
```

**3. Verify clean working tree:**
```bash
git fetch --all --prune
# bd commands auto-stage .beads/issues.jsonl — commit any pending bead delta first:
git diff --quiet --cached .beads/issues.jsonl || git commit -m "chore(beads): pre-release sync" -- .beads/issues.jsonl
git status --porcelain   # MUST be empty
```

If `git status --porcelain` is non-empty, STOP and mail Witness — do not
release on top of unstaged work.

**4. Confirm intent:**

You are about to publish 19 packages to the public npm registry under
`@apicity/*`. Once `latest`-tagged versions are out, they cannot be unpublished
after 72h. Read the values:

  - version  = {{version}}
  - dist_tag = {{dist_tag}}
  - dry_run  = {{dry_run}}

**Exit criteria:** Working tree clean, vars confirmed, release bead read."""

[[steps]]
id = "sync-stable"
title = "Fast-forward stable from main"
needs = ["load-context"]
description = """
Bring `stable` up to the head of `main` so the release reflects the agent
working branch's tip.

```bash
git checkout stable
git pull --ff-only origin stable
git merge --ff-only origin/main
```

**If `merge --ff-only` fails:** `stable` has diverged from `main`. STOP. This
is a human decision — either rebase `stable` onto `main` (rewrites stable
history; usually fine for an alpha) or cherry-pick the missing commits. Mail
Witness with the divergence summary; do not improvise.

**Exit criteria:** Local `stable` is at `origin/main` HEAD."""

[[steps]]
id = "preflight-gates"
title = "Run the CI mirror locally"
needs = ["sync-stable"]
description = """
Mirror exactly what CI runs (`pnpm run ci:local` = build + lint + test:run).
A red preflight here means CI on `stable` will be red — abort the release.

```bash
pnpm install --frozen-lockfile
pnpm run ci:local
```

If `ci:local` fails:
  - Investigate the root cause; do NOT release with red tests or a build break.
  - File a bd bug if the failure is pre-existing on stable.
  - If the failure was introduced by main->stable merge, revert the merge
    and STOP.

**Exit criteria:** `pnpm run ci:local` exits 0."""

[[steps]]
id = "verify-publish-config"
title = "Verify every package is publish-ready"
needs = ["preflight-gates"]
description = """
Confirm every publishable package has the metadata it needs to ship cleanly.

Use `command grep` (not the alias — many shells alias `grep` to `ugrep` which has different flags) and explicit paths via `find` (not `ls -d`, which is aliased to `eza`/`lsd` in many environments and prints columns, not paths).

```bash
node -e '
const fs = require("fs");
const PKGS = [
  "packages/mcp-server",
  ...["alibaba","anthropic","cost","dolthub","elevenlabs","fal","fireworks","free-media-upload","google","meta","kie","kimicoding","openai","polymarket","telegram","x","xai","youtube"]
    .map(p => "packages/provider/" + p),
];
let bad = 0;
for (const p of PKGS) {
  const pkg = JSON.parse(fs.readFileSync(p + "/package.json", "utf8"));
  if (pkg.private === true) { console.log("✗ private:true in", p); bad++; }
  if (!(pkg.publishConfig && pkg.publishConfig.access === "public"))
    { console.log("✗ missing publishConfig.access=public in", p); bad++; }
  if (!fs.existsSync(p + "/LICENSE"))
    { console.log("✗ missing LICENSE in", p); bad++; }
}
if (bad === 0) console.log("✓ all 19 packages publish-ready");
process.exit(bad === 0 ? 0 : 1);
'
```

If any of these fail, the prep work was not completed. STOP. File a bug
referencing the parent epic and abort the release — pour again once prep is
green.

**Exit criteria:** All 19 packages pass all three checks."""

[[steps]]
id = "bump-versions"
title = "Bump every @apicity/* package to {{version}}"
needs = ["verify-publish-config"]
description = """
Bump in lockstep — all 19 packages ship under one version. Don't use
`pnpm -r exec npm version` here — it implicitly runs `npm install`, which
trips on the optional zod peer dep. Direct JSON write is simpler and
deterministic:

```bash
node -e '
const fs = require("fs");
const PKGS = [
  "packages/mcp-server/package.json",
  ...["alibaba","anthropic","cost","dolthub","elevenlabs","fal","fireworks","free-media-upload","google","meta","kie","kimicoding","openai","polymarket","telegram","x","xai","youtube"]
    .map(p => "packages/provider/" + p + "/package.json"),
];
for (const p of PKGS) {
  const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
  pkg.version = "{{version}}";
  fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\\n");
}
const wrong = PKGS.filter(p => JSON.parse(fs.readFileSync(p, "utf8")).version !== "{{version}}");
if (wrong.length) { console.log("WRONG:", wrong); process.exit(1); }
console.log("✓ all 19 at {{version}}");
'
```

**Commit the bump:**
```bash
git add packages/mcp-server/package.json packages/provider/*/package.json
git commit -m "chore(release): @apicity/* → {{version}}"
```

**Exit criteria:** All 19 package.json files at `{{version}}`, change committed."""

[[steps]]
id = "publish-dry-run"
title = "Inspect tarballs with --dry-run"
needs = ["bump-versions"]
description = """
Preview every tarball before sending real bytes. This catches:
  - tarballs that ship `tests/recordings/` (they shouldn't — `files` is dist-only)
  - missing `dist/`, `README.md`, or `LICENSE`
  - secrets accidentally left in source
  - mcp-server's `bin.js` not present or missing shebang

```bash
pnpm -r --filter "@apicity/*" publish --dry-run --tag {{dist_tag}} --no-git-checks 2>&1 | tee /tmp/apicity-dry-run.log
```

**Sanity-check the log manually:**

  - For each of the 19 packages, the tarball lists `dist/...`, `README.md`,
    `LICENSE`, and `package.json` — and nothing else. No `tests/`, no
    `.env*`, no `*.har` recordings.
  - File counts and total size look reasonable (anything >10MB is suspicious).
  - For `@apicity/mcp-server`, the `dist/src/bin.js` entry is present.

If anything looks off, STOP. Investigate before publishing for real.

**If dry_run = "true": STOP HERE.** Do not proceed to the publish step.
Mail Witness with the dry-run log path and exit. The release ends on a
dry-run when {{dry_run}} = true.

```bash
[ "{{dry_run}}" = "true" ] && { echo "dry_run=true → stopping after dry-run"; gc runtime drain-ack; exit 0; } || true
```

**Exit criteria:** Dry-run exits 0, every tarball inspected, ready to publish for real."""

[[steps]]
id = "publish"
title = "Publish to npm"
needs = ["publish-dry-run"]
description = """
Publish with the npm token stored in 1Password. Do not write the token to the
repo, shell history, or logs.

**1. Verify token access and auth:**
```bash
op read 'op://apicity/NPM_TOKEN/password' >/dev/null

tmp_npmrc=$(mktemp)
cleanup() { rm -f "$tmp_npmrc"; }
trap cleanup EXIT
npm_token=$(op read 'op://apicity/NPM_TOKEN/password')
printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n' "$npm_token" > "$tmp_npmrc"
NPM_CONFIG_USERCONFIG="$tmp_npmrc" npm whoami   # MUST print the publishing account
NPM_CONFIG_USERCONFIG="$tmp_npmrc" npm config get registry
```

If `op read` or `npm whoami` errors, STOP. Fix 1Password access or the
`NPM_TOKEN` item before publishing.

**2. Publish all 19 packages:**
```bash
NPM_CONFIG_USERCONFIG="$tmp_npmrc" pnpm -r --filter "@apicity/*" publish --tag {{dist_tag}} --no-git-checks
```

`--no-git-checks` is required because we're publishing from a release commit
that may not yet have an upstream tag (the `tag-and-push` step handles that
next).

**3. Verify on the registry:**
```bash
npm view @apicity/openai dist-tags    # expect {{dist_tag}}: {{version}}
npm view @apicity/mcp-server dist-tags
```

If publish fails partway through (network, auth lapse), some packages may
already be live. STOP. Resume by re-running `pnpm publish` for only the
packages that didn't get through with the same `NPM_CONFIG_USERCONFIG`
environment. npm rejects re-publishing the same version, so it's safe to retry
the whole filter.

**Exit criteria:** All 19 packages visible at `{{version}}` under `{{dist_tag}}`."""

[[steps]]
id = "tag-and-push"
title = "Tag the release and push stable"
needs = ["publish"]
description = """
Annotate the release commit and propagate to the remote.

```bash
git tag -a v{{version}} -m "Release Apicity v{{version}} ({{dist_tag}})"
git push origin stable
git push origin v{{version}}
```

**Exit criteria:** `origin/stable` is up to date and `v{{version}}` tag is pushed."""

[[steps]]
id = "update-github-release"
title = "Update the GitHub release page"
needs = ["tag-and-push"]
description = '''
Create or update the GitHub release page for the pushed `v{{version}}` tag.
This is the public release page humans see in GitHub.

**1. Verify GitHub CLI auth:**
```bash
gh auth status
```

If `gh auth status` fails, STOP. Fix GitHub CLI authentication before
continuing; do not skip the release page.

**2. Build release notes from the root changelog when available:**
```bash
notes="/tmp/apicity-github-release-v{{version}}.md"
node <<'NODE' > "$notes"
const fs = require("fs");
const version = "{{version}}";
const distTag = "{{dist_tag}}";
const changelog = fs.existsSync("CHANGELOG.md")
  ? fs.readFileSync("CHANGELOG.md", "utf8")
  : "";

const section = changelog
  .split(/^## /m)
  .slice(1)
  .find((part) =>
    part.startsWith(`[${version}]`) ||
    part.startsWith(`${version} `) ||
    part.startsWith(`${version}\n`)
  );

const body = section
  ? section.replace(/^[^\n]*\n?/, "").trim()
  : "";

console.log(`# Apicity v${version}`);
console.log("");
console.log(`- npm dist-tag: \`${distTag}\``);
console.log("- Published packages: 19 @apicity packages in lockstep");
console.log(`- Git tag: \`v${version}\``);
console.log("");

if (body) {
  console.log("## Changelog");
  console.log("");
  console.log(body);
} else {
  console.log("Published the lockstep Apicity package set to npm.");
}
NODE
cat "$notes"
```

**3. Create or update the release page:**
```bash
if gh release view "v{{version}}" >/dev/null 2>&1; then
  edit_flags=(--title "v{{version}}" --notes-file "$notes")
  if [ "{{dist_tag}}" = "latest" ]; then
    edit_flags+=(--latest)
  else
    edit_flags+=(--prerelease --latest=false)
  fi
  gh release edit "v{{version}}" "${edit_flags[@]}"
else
  flags=(--verify-tag --title "v{{version}}" --notes-file "$notes")
  if [ "{{dist_tag}}" = "latest" ]; then
    flags+=(--latest)
  else
    flags+=(--prerelease --latest=false)
  fi
  gh release create "v{{version}}" "${flags[@]}"
fi
gh release view "v{{version}}"
```

**Exit criteria:** GitHub release page for `v{{version}}` exists, has current
notes, and is marked prerelease unless `dist_tag` is `latest`.'''

[[steps]]
id = "sync-main-release"
title = "Fast-forward main to the release commit"
needs = ["update-github-release"]
description = """
Propagate the release version bump back to `main` so `main` and `stable` do
not drift after publishing.

```bash
git checkout main
git pull --ff-only origin main
git merge --ff-only stable
git push origin main
git checkout stable
```

**If `merge --ff-only` fails:** `main` has moved since the release started.
STOP and mail Witness with the divergence summary. Do not create a merge
commit or cherry-pick without an explicit decision.

**Exit criteria:** `origin/main` and `origin/stable` point at the release
commit, and the working branch is back on `stable`."""

[[steps]]
id = "smoke-install"
title = "Install the published package in a clean dir"
needs = ["sync-main-release"]
description = """
End-to-end sanity: a fresh consumer install resolves the just-published
artifact and the entrypoint loads.

```bash
SMOKE=$(mktemp -d)
cd "$SMOKE"
npm init -y >/dev/null
npm install @apicity/openai@{{dist_tag}}
node -e 'import("@apicity/openai").then(m => console.log("✓ exports:", Object.keys(m).slice(0, 5)))'
cd - >/dev/null
rm -rf "$SMOKE"
```

If the install fails or the dynamic import throws, the published tarball is
broken. STOP and mail Witness — `npm deprecate` may be needed for this
version before the next release.

**Exit criteria:** Smoke install + import succeed."""

[[steps]]
id = "close"
title = "Close the release bead"
needs = ["smoke-install"]
description = """
Record the release in beads memory and close the tracking bead.

```bash
bd close {{release_bead}} --reason "Published Apicity v{{version}} on dist-tag {{dist_tag}}; tag v{{version}} pushed; origin/main and origin/stable synced to release commit"
bd remember "apicity-last-release: v{{version}} on {{dist_tag}} ($(date +%Y-%m-%d))"
```

**Drain:**
```bash
gc runtime drain-ack
```

**Exit criteria:** Release bead closed, drain acknowledged."""
