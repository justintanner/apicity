description = """
Apicity npm release formula — cut a release of @apicity/* packages from the
`stable` branch to the npm registry.

Branch model:
  - main   = agents work here (feature work lands here first)
  - stable = release branch; releases cut from stable; tags pushed to stable

Before touching `stable` or publishing, the formula first verifies that the
current `origin/main` passes local tests, the local CI mirror, and GitHub CI.

The formula publishes every public @apicity/* workspace package in one go:
providers under packages/provider/* plus packages/mcp-server. The package set
is discovered from package manifests so newly added packages ship with the
rest. All ship under one three-part version and the npm `latest` tag.

The `publish` step uses the `NPM_TOKEN` item in the `apicity` 1Password vault
(`op://apicity/NPM_TOKEN/password`) through a temporary npm user config. The
token must have publish access for the `@apicity` scope.

## Variables

| Variable     | Source | Default | Description                                    |
|--------------|--------|---------|------------------------------------------------|
| version      | caller | —       | Three-part semver to publish, e.g. 0.4.1       |
| dry_run      | caller | false   | If "true", stop after publish-dry-run          |
| release_bead | caller | —       | Tracking bead this release closes              |
"""
formula = "mol-apicity-release"
version = 1
contract = "graph.v2"
target_required = false

[requires]
formula_compiler = ">=2.0.0"

[catalog]
name = "mol-apicity-release"
description = "Cut an Apicity npm release from stable through publish, tagging, GitHub release notes, main sync, smoke install, and release tracking."

[metadata.gc]
workflow = "apicity-release"
run_target = "{{run_target}}"
control_path = "apicity/core.control-dispatcher"

[vars]
[vars.version]
description = "Three-part semver string to publish, e.g. 0.4.1."
required = true

[vars.dry_run]
description = 'If "true", stop after publish-dry-run; do not run real publish or git push.'
default = "false"

[vars.release_bead]
description = "The tracking bead this release is closing. Closed in the final step."
required = true

[vars.run_target]
description = "Gas City run target for release step execution."
default = "apicity/gastown.polecat"

[[steps]]
id = "load-context"
title = "Load context and verify clean working tree"
metadata = { "gc.run_target" = "{{run_target}}" }
description = """
Initialize the session and verify the repo is in a publishable state.

**1. Prime your environment:**
```bash
bd prime
```

**2. Read the release bead and plan:**
```bash
bd show {{release_bead}}
cat /Users/jwt/apicity/RELEASE.md   # release process doc (if present)
```

**3. Verify clean working tree:**
```bash
git fetch --all --prune
# bd commands auto-stage .beads/issues.jsonl — commit any pending bead delta first:
git diff --quiet --cached .beads/issues.jsonl || git commit -m "chore(beads): release sync" -- .beads/issues.jsonl
git status --porcelain   # MUST be empty
```

If `git status --porcelain` is non-empty, STOP and mail Witness — do not
release on top of unstaged work.

**4. Confirm intent:**

You are about to publish every public `@apicity/*` workspace package to the
public npm registry. Once `latest`-tagged versions are out, they cannot be
unpublished after 72h. Read the values:

  - version = {{version}}
  - npm tag = latest
  - dry_run = {{dry_run}}

Validate the version before continuing:

```bash
node -e '
const version = process.argv[1];
if (!/^[0-9]+\\.[0-9]+\\.[0-9]+$/.test(version)) {
  console.error(`Release version must be X.Y.Z, got ${version}`);
  process.exit(1);
}
' "{{version}}"
```

**Exit criteria:** Working tree clean, vars confirmed, release bead read."""

[[steps]]
id = "verify-main-gates"
title = "Verify tests and CI are green on main"
needs = ["load-context"]
metadata = { "gc.run_target" = "{{run_target}}" }
description = """
Before changing `stable`, bumping versions, or publishing, prove that the exact
`main` commit being released is green.

**1. Update local `main` to match the remote:**
```bash
git checkout main
git pull --ff-only origin main
main_sha=$(git rev-parse origin/main)
test "$(git rev-parse HEAD)" = "$main_sha"
```

If the pull cannot fast-forward, STOP. `main` has local divergence or unpushed
work; do not release until `main` is clean and matches `origin/main`.

**2. Run tests and the local CI mirror on `main`:**
```bash
pnpm install --frozen-lockfile
pnpm run test:run
pnpm run ci:local
```

`ci:local` already includes the replay test suite, but `test:run` is kept here
as an explicit release gate so test failures are visible before the broader CI
mirror runs.

**3. Verify GitHub CI is green for the same `origin/main` SHA:**
```bash
main_sha=$(git rev-parse origin/main)
run_json=$(gh run list \
  --branch main \
  --workflow CI \
  --commit "$main_sha" \
  --limit 1 \
  --json databaseId,status,conclusion,headSha,url)

node -e '
const [run] = JSON.parse(process.argv[1]);
if (!run) {
  console.error("No GitHub CI run found for origin/main");
  process.exit(1);
}
console.log(`${run.status}/${run.conclusion || "-"} ${run.url}`);
if (run.headSha !== process.argv[2]) {
  console.error(`CI run is for ${run.headSha}, expected ${process.argv[2]}`);
  process.exit(1);
}
if (run.status !== "completed" || run.conclusion !== "success") {
  console.error("GitHub CI on main is not green; wait for success or fix main.");
  process.exit(1);
}
' "$run_json" "$main_sha"
```

If the GitHub run is missing, pending, cancelled, or failed, STOP. Do not sync
`stable` and do not publish until CI on `main` is green.

**Exit criteria:** Local `test:run` and `ci:local` pass on `main`, and GitHub
CI reports success for the same `origin/main` commit."""

[[steps]]
id = "sync-stable"
title = "Fast-forward stable from main"
needs = ["verify-main-gates"]
metadata = { "gc.run_target" = "{{run_target}}" }
description = """
Bring `stable` up to the head of `main` so the release reflects the agent
working branch's tip.

```bash
git checkout stable
git pull --ff-only origin stable
git merge --ff-only origin/main
```

**If `merge --ff-only` fails:** `stable` has diverged from `main`. STOP. This
is a human decision — either rebase `stable` onto `main` or cherry-pick the
missing commits. Mail Witness with the divergence summary; do not improvise.

**Exit criteria:** Local `stable` is at `origin/main` HEAD."""

[[steps]]
id = "preflight-gates"
title = "Run the CI mirror locally"
needs = ["sync-stable"]
metadata = { "gc.run_target" = "{{run_target}}" }
description = """
Mirror exactly what CI runs (`pnpm run ci:local` = build + lint + test:run).
A red preflight here means CI on `stable` will be red — abort the release.

```bash
pnpm install --frozen-lockfile
pnpm run ci:local
```

If `ci:local` fails:
  - Investigate the root cause; do NOT release with red tests or a build break.
  - File a bd bug if the failure is pre-existing on stable.
  - If the failure was introduced by main->stable merge, revert the merge
    and STOP.

**Exit criteria:** `pnpm run ci:local` exits 0."""

[[steps]]
id = "verify-publish-config"
title = "Verify every package is publish-ready"
needs = ["preflight-gates"]
metadata = { "gc.run_target" = "{{run_target}}" }
description = """
Confirm every publishable package has the metadata it needs to ship cleanly.

Use `command grep` (not the alias — many shells alias `grep` to `ugrep` which has different flags) and explicit paths via `find` (not `ls -d`, which is aliased to `eza`/`lsd` in many environments and prints columns, not paths).

```bash
node <<'NODE'
const fs = require("fs");

function readPublishablePackages() {
  const dirs = [
    "packages/mcp-server",
    ...fs
      .readdirSync("packages/provider", { withFileTypes: true })
      .filter((entry) => entry.isDirectory())
      .map((entry) => `packages/provider/${entry.name}`),
  ];

  return dirs
    .filter((dir) => fs.existsSync(`${dir}/package.json`))
    .map((dir) => ({
      dir,
      pkg: JSON.parse(fs.readFileSync(`${dir}/package.json`, "utf8")),
    }))
    .filter(({ pkg }) =>
      pkg.name && pkg.name.startsWith("@apicity/") && pkg.private !== true
    )
    .sort((a, b) => a.pkg.name.localeCompare(b.pkg.name));
}

const pkgs = readPublishablePackages();
let bad = 0;
for (const { dir, pkg } of pkgs) {
  if (!(pkg.publishConfig && pkg.publishConfig.access === "public"))
    { console.log("✗ missing publishConfig.access=public in", dir); bad++; }
  if (!fs.existsSync(`${dir}/LICENSE`))
    { console.log("✗ missing LICENSE in", dir); bad++; }
}
if (bad === 0) console.log(`✓ all ${pkgs.length} packages publish-ready`);
process.exit(bad === 0 ? 0 : 1);
NODE
```

If any of these fail, the prep work was not completed. STOP. File a bug
referencing the parent epic and abort the release — pour again once prep is
green.

**Exit criteria:** Every public `@apicity/*` package passes all three checks."""

[[steps]]
id = "bump-versions"
title = "Bump every @apicity/* package to {{version}}"
needs = ["verify-publish-config"]
metadata = { "gc.run_target" = "{{run_target}}" }
description = """
Bump in lockstep — every public `@apicity/*` package ships under one version. Don't use
`pnpm -r exec npm version` here — it implicitly runs `npm install`, which
trips on the optional zod peer dep. Direct JSON write is simpler and
deterministic:

```bash
node <<'NODE'
const fs = require("fs");

function readPublishablePackageJsonPaths() {
  const dirs = [
    "packages/mcp-server",
    ...fs
      .readdirSync("packages/provider", { withFileTypes: true })
      .filter((entry) => entry.isDirectory())
      .map((entry) => `packages/provider/${entry.name}`),
  ];

  return dirs
    .map((dir) => `${dir}/package.json`)
    .filter((p) => fs.existsSync(p))
    .filter((p) => {
      const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
      return (
        pkg.name && pkg.name.startsWith("@apicity/") && pkg.private !== true
      );
    })
    .sort((a, b) => {
      const aPkg = JSON.parse(fs.readFileSync(a, "utf8"));
      const bPkg = JSON.parse(fs.readFileSync(b, "utf8"));
      return aPkg.name.localeCompare(bPkg.name);
    });
}

const packageJsonPaths = readPublishablePackageJsonPaths();
for (const p of packageJsonPaths) {
  const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
  pkg.version = "{{version}}";
  fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\\n");
}
const wrong = packageJsonPaths.filter(p => JSON.parse(fs.readFileSync(p, "utf8")).version !== "{{version}}");
if (wrong.length) { console.log("WRONG:", wrong); process.exit(1); }
console.log(`✓ all ${packageJsonPaths.length} at {{version}}`);
NODE
```

**Commit the bump:**
```bash
git add packages/mcp-server/package.json packages/provider/*/package.json
git commit -m "chore(release): @apicity/* → {{version}}"
```

**Exit criteria:** Every public `@apicity/*` package manifest is at `{{version}}`, change committed."""

[[steps]]
id = "publish-dry-run"
title = "Inspect tarballs with --dry-run"
needs = ["bump-versions"]
metadata = { "gc.run_target" = "{{run_target}}" }
description = """
Preview every tarball before sending real bytes. This catches:
  - tarballs that ship `tests/recordings/` (they shouldn't — `files` is dist-only)
  - missing `dist/`, `README.md`, or `LICENSE`
  - secrets accidentally left in source
  - mcp-server's `bin.js` not present or missing shebang

```bash
pnpm -r --filter "@apicity/*" publish --dry-run --tag latest --no-git-checks 2>&1 | tee /tmp/apicity-dry-run.log
```

**Sanity-check the log manually:**

  - For each package, the tarball lists `dist/...`, `README.md`,
    `LICENSE`, and `package.json` — and nothing else. No `tests/`, no
    `.env*`, no `*.har` recordings.
  - File counts and total size look reasonable (anything >10MB is suspicious).
  - For `@apicity/mcp-server`, the `dist/src/bin.js` entry is present.

If anything looks off, STOP. Investigate before publishing for real.

**If dry_run = "true": STOP HERE.** Do not proceed to the publish step.
Mail Witness with the dry-run log path and exit. The release ends on a
dry-run when {{dry_run}} = true.

```bash
[ "{{dry_run}}" = "true" ] && { echo "dry_run=true → stopping after dry-run"; gc runtime drain-ack; exit 0; } || true
```

**Exit criteria:** Dry-run exits 0, every tarball inspected, ready to publish for real."""

[[steps]]
id = "dry-run-stop"
title = "Stop after dry-run"
needs = ["publish-dry-run"]
condition = "{{dry_run}} == true"
metadata = { "gc.run_target" = "{{run_target}}" }
description = """
The release was launched with `dry_run=true`, so the workflow intentionally
ends after the publish dry-run. Do not publish to npm, tag, push, update
GitHub releases, sync `main`, smoke install, or close the release tracking
bead.

Confirm the dry-run log path in a note and drain this session:

```bash
gc runtime drain-ack
```

**Exit criteria:** Dry-run end state recorded, session drained."""

[[steps]]
id = "publish"
title = "Publish to npm"
needs = ["publish-dry-run"]
condition = "{{dry_run}} != true"
metadata = { "gc.run_target" = "{{run_target}}" }
description = """
Publish with the npm token stored in 1Password. Do not write the token to the
repo, shell history, or logs.

**1. Verify token access and auth:**
```bash
op read 'op://apicity/NPM_TOKEN/password' >/dev/null

tmp_npmrc=$(mktemp)
cleanup() { rm -f "$tmp_npmrc"; }
trap cleanup EXIT
npm_token=$(op read 'op://apicity/NPM_TOKEN/password')
printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n' "$npm_token" > "$tmp_npmrc"
NPM_CONFIG_USERCONFIG="$tmp_npmrc" npm whoami   # MUST print the publishing account
NPM_CONFIG_USERCONFIG="$tmp_npmrc" npm config get registry
```

If `op read` or `npm whoami` errors, STOP. Fix 1Password access or the
`NPM_TOKEN` item before publishing.

**2. Publish all public `@apicity/*` packages:**
```bash
NPM_CONFIG_USERCONFIG="$tmp_npmrc" pnpm -r --filter "@apicity/*" publish --tag latest --no-git-checks
```

`--no-git-checks` is required because we're publishing from a release commit
that may not yet have an upstream tag (the `tag-and-push` step handles that
next).

**3. Verify on the registry:**
```bash
npm view @apicity/openai dist-tags    # expect latest: {{version}}
npm view @apicity/mcp-server dist-tags
```

If publish fails partway through (network, auth lapse), some packages may
already be live. STOP. Resume by re-running `pnpm publish` for only the
packages that didn't get through with the same `NPM_CONFIG_USERCONFIG`
environment. npm rejects re-publishing the same version, so it's safe to retry
the whole filter.

**Exit criteria:** Every public `@apicity/*` package is visible at `{{version}}` under `latest`."""

[[steps]]
id = "tag-and-push"
title = "Tag the release and push stable"
needs = ["publish"]
condition = "{{dry_run}} != true"
metadata = { "gc.run_target" = "{{run_target}}" }
description = """
Annotate the release commit and propagate to the remote.

```bash
git tag -a v{{version}} -m "Release Apicity v{{version}}"
git push origin stable
git push origin v{{version}}
```

**Exit criteria:** `origin/stable` is up to date and `v{{version}}` tag is pushed."""

[[steps]]
id = "update-github-release"
title = "Update the GitHub release page"
needs = ["tag-and-push"]
condition = "{{dry_run}} != true"
metadata = { "gc.run_target" = "{{run_target}}" }
description = '''
Create or update the GitHub release page for the pushed `v{{version}}` tag.
This is the public release page humans see in GitHub.

**1. Verify GitHub CLI auth:**
```bash
gh auth status
```

If `gh auth status` fails, STOP. Fix GitHub CLI authentication before
continuing; do not skip the release page.

**2. Build release notes from closed beads, with git as fallback:**
```bash
notes="/tmp/apicity-github-release-v{{version}}.md"
node <<'NODE' > "$notes"
const fs = require("fs");
const { execFileSync } = require("child_process");

const version = "{{version}}";
const releaseBead = "{{release_bead}}";
const currentTag = `v${version}`;
const commandMaxBuffer = 64 * 1024 * 1024;

function run(command, args) {
  try {
    return execFileSync(command, args, {
      encoding: "utf8",
      maxBuffer: commandMaxBuffer,
      stdio: ["ignore", "pipe", "ignore"],
    }).trim();
  } catch {
    return "";
  }
}

function runJson(command, args) {
  const output = run(command, args);
  if (!output) return null;
  try {
    return JSON.parse(output);
  } catch {
    return null;
  }
}

function git(args) {
  return run("git", args);
}

function bd(args) {
  return runJson("bd", [...args, "--json"]);
}

function readPackages() {
  const dirs = [
    "packages/mcp-server",
    ...fs
      .readdirSync("packages/provider", { withFileTypes: true })
      .filter((entry) => entry.isDirectory())
      .map((entry) => `packages/provider/${entry.name}`),
  ];

  return dirs
    .filter((dir) => fs.existsSync(`${dir}/package.json`))
    .map((dir) => JSON.parse(fs.readFileSync(`${dir}/package.json`, "utf8")))
    .filter((pkg) => pkg.name && pkg.name.startsWith("@apicity/"))
    .sort((a, b) => a.name.localeCompare(b.name));
}

function findPreviousTag() {
  const nearest = git([
    "describe",
    "--tags",
    "--abbrev=0",
    `${currentTag}^`,
    "--match",
    "v[0-9]*",
  ]);
  if (nearest) return nearest;

  return git([
    "tag",
    "--merged",
    currentTag,
    "--sort=-version:refname",
    "--list",
    "v*",
  ])
    .split("\n")
    .find((tag) => tag && tag !== currentTag) || "";
}

function tagDate(tag) {
  const taggerDate = git([
    "for-each-ref",
    `refs/tags/${tag}`,
    "--format=%(taggerdate:iso-strict)",
  ]);
  if (taggerDate) return taggerDate;
  return git(["log", "-1", "--format=%cI", tag]);
}

function readCommits(previousTag) {
  const range = previousTag ? `${previousTag}..${currentTag}` : currentTag;
  return git(["log", "--format=%h%x09%s", range])
    .split("\n")
    .filter(Boolean)
    .map((line) => {
      const [hash, ...subjectParts] = line.split("\t");
      return { hash, subject: subjectParts.join("\t") };
    });
}

function releaseVersionFromTag(tag) {
  return tag.replace(/^v/, "");
}

function findPreviousReleaseIssue(previousTag) {
  if (!previousTag) return null;

  const needles = [previousTag, releaseVersionFromTag(previousTag)];
  const byId = new Map();
  for (const needle of needles) {
    const rows = bd([
      "list",
      "--status=closed",
      "--title",
      needle,
      "--limit",
      "0",
    ]);
    if (Array.isArray(rows)) {
      for (const issue of rows) byId.set(issue.id, issue);
    }
  }

  return [...byId.values()]
    .filter((issue) => isReleaseTrackingIssue(issue))
    .sort((a, b) => {
      const aTime = Date.parse(a.closed_at || "") || 0;
      const bTime = Date.parse(b.closed_at || "") || 0;
      return bTime - aTime;
    })[0] || null;
}

function isReleaseTrackingIssue(issue) {
  const title = String(issue.title || "");
  const reason = String(issue.close_reason || "");
  return (
    /^release( apicity)? v?\d+\.\d+\.\d+/i.test(title) ||
    /^release \d+\.\d+\.\d+/i.test(title) ||
    /published apicity v?\d+\.\d+\.\d+/i.test(reason)
  );
}

function isInfrastructureIssue(issue) {
  const id = String(issue.id || "");
  const parent = String(issue.parent || "");
  const title = String(issue.title || "");
  return (
    /\bmol\b/i.test(id) ||
    /\bmol\b/i.test(parent) ||
    ["molecule", "gate", "convoy", "step", "wisp", "order"].includes(
      issue.issue_type
    ) ||
    /^mol[-: ]/i.test(title) ||
    /^(order|nudge):/i.test(title)
  );
}

function isAdministrativeClosureIssue(issue) {
  const reason = normalize([
    issue.close_reason,
    issue.metadata?.close_reason,
  ].filter(Boolean).join(" "));

  return (
    /^(cancell?ed|closed) per user request\b/i.test(reason) ||
    /^cancell?ed\b/i.test(reason) ||
    /\bmass-cancell?ed\b/i.test(reason) ||
    /^molecule (cleanup|autoclose):/i.test(reason) ||
    /\bsubtree force-closed\b/i.test(reason)
  );
}

function isReleaseCommit(commit) {
  return (
    /^(chore|fix)\(release\):/i.test(commit.subject) ||
    /\b@apicity\/\*\s+(to|→)\s+\d/i.test(commit.subject)
  );
}

function escapeRegExp(value) {
  return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function shippedInPreviousRelease(issue, previousTag) {
  if (!previousTag) return false;
  const previousVersion = releaseVersionFromTag(previousTag);
  const text = [
    issue.title,
    issue.description,
    issue.close_reason,
    issue.notes,
  ].map(normalize).join(" ");

  return new RegExp(
    `\\b(v?${escapeRegExp(previousVersion)}|@apicity/[^\\s]+@${escapeRegExp(previousVersion)})\\b`,
    "i"
  ).test(text);
}

function readClosedWork(previousRelease, previousTag, currentDate) {
  const previousDate = previousRelease?.closed_at || tagDate(previousTag);
  const args = ["list", "--status=closed", "--sort", "closed", "--limit", "0"];
  if (previousDate) args.push("--closed-after", previousDate);
  if (currentDate) args.push("--closed-before", currentDate);

  const issues = bd(args);
  const work = Array.isArray(issues) ? issues : [];
  return {
    previousDate,
    work: work
      .filter((issue) => issue.id !== releaseBead)
      .filter((issue) => !isReleaseTrackingIssue(issue))
      .filter((issue) => !isInfrastructureIssue(issue))
      .filter((issue) => !isAdministrativeClosureIssue(issue))
      .filter((issue) => !shippedInPreviousRelease(issue, previousTag)),
  };
}

function normalize(value) {
  return String(value || "").replace(/\s+/g, " ").trim();
}

function shorten(value, maxLength = 260) {
  const text = normalize(value);
  if (text.length <= maxLength) return text;
  return `${text.slice(0, maxLength - 3).trimEnd()}...`;
}

function printWorkItems(items) {
  for (const issue of items) {
    const title = normalize(issue.title);
    const reason = shorten(issue.close_reason || issue.description);
    const priority = Number.isInteger(issue.priority)
      ? `P${issue.priority}`
      : "P?";
    const suffix = reason ? ` - ${reason}` : "";
    console.log(`- **${title}** (\`${issue.id}\`, ${priority})${suffix}`);
  }
  console.log("");
}

function printCommitFallback(commits) {
  const visible = commits.filter((commit) => !isReleaseCommit(commit));
  if (!visible.length) return;

  console.log(
    "No closed bead work was found for this release window, so these non-release commits are listed instead."
  );
  console.log("");
  for (const commit of visible) {
    console.log(`- \`${commit.hash}\` ${commit.subject}`);
  }
  console.log("");
}

const packages = readPackages();
const previousTag = findPreviousTag();
const previousRelease = findPreviousReleaseIssue(previousTag);
const currentDate = tagDate(currentTag) || new Date().toISOString();
const { previousDate, work } = readClosedWork(
  previousRelease,
  previousTag,
  currentDate
);
const commits = readCommits(previousTag);

console.log(`# Apicity v${version}`);
console.log("");
console.log("## Summary");
console.log("");
if (work.length) {
  printWorkItems(work);
} else {
  console.log("No closed non-release beads were found for this release window.");
  console.log("");
  printCommitFallback(commits);
}

console.log("## Published Packages");
console.log("");
for (const pkg of packages) {
  console.log(`- \`${pkg.name}@${pkg.version}\``);
}
NODE
cat "$notes"
```

Review the generated file before uploading it. `Summary` should contain a flat
list of closed bead work. It should not include release metadata, `Released
Work`, `What's Changed`, `Release Maintenance`, or type grouping headings.

**3. Create or update the release page:**
```bash
if gh release view "v{{version}}" >/dev/null 2>&1; then
  gh release edit "v{{version}}" --title "v{{version}}" --notes-file "$notes" --latest
else
  gh release create "v{{version}}" --verify-tag --title "v{{version}}" --notes-file "$notes" --latest
fi
gh release view "v{{version}}"
```

**Exit criteria:** GitHub release page for `v{{version}}` exists, has current
bead-based notes, and is marked as the latest release.'''

[[steps]]
id = "sync-main-release"
title = "Fast-forward main to the release commit"
needs = ["update-github-release"]
condition = "{{dry_run}} != true"
metadata = { "gc.run_target" = "{{run_target}}" }
description = """
Propagate the release version bump back to `main` so `main` and `stable` do
not drift after publishing.

```bash
git checkout main
git pull --ff-only origin main
git merge --ff-only stable
git push origin main
git checkout stable
```

**If `merge --ff-only` fails:** `main` has moved since the release started.
STOP and mail Witness with the divergence summary. Do not create a merge
commit or cherry-pick without an explicit decision.

**Exit criteria:** `origin/main` and `origin/stable` point at the release
commit, and the working branch is back on `stable`."""

[[steps]]
id = "smoke-install"
title = "Install the published package in a clean dir"
needs = ["sync-main-release"]
condition = "{{dry_run}} != true"
metadata = { "gc.run_target" = "{{run_target}}" }
description = """
End-to-end sanity: a fresh consumer install resolves the just-published
artifact and the entrypoint loads.

```bash
SMOKE=$(mktemp -d)
cd "$SMOKE"
npm init -y >/dev/null
npm install @apicity/openai@latest
node -e 'import("@apicity/openai").then(m => console.log("✓ exports:", Object.keys(m).slice(0, 5)))'
cd - >/dev/null
rm -rf "$SMOKE"
```

If the install fails or the dynamic import throws, the published tarball is
broken. STOP and mail Witness — `npm deprecate` may be needed for this
version before the next release.

**Exit criteria:** Smoke install + import succeed."""

[[steps]]
id = "close"
title = "Close the release bead"
needs = ["smoke-install"]
condition = "{{dry_run}} != true"
metadata = { "gc.run_target" = "{{run_target}}" }
description = """
Record the release in beads memory and close the tracking bead.

```bash
bd close {{release_bead}} --reason "Published Apicity v{{version}} on npm latest; tag v{{version}} pushed; origin/main and origin/stable synced to release commit"
bd remember --key apicity-last-release \
  "version={{version}} tag=v{{version}} npm_tag=latest release_bead={{release_bead}} released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
```

**Drain:**
```bash
gc runtime drain-ack
```

**Exit criteria:** Release bead closed, drain acknowledged."""
