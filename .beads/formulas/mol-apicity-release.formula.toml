description = """
Apicity npm release formula — cut a release of @apicity/* packages from the
`stable` branch to the npm registry.

Branch model:
  - main   = agents work here (feature work lands here first)
  - stable = release branch; releases cut from stable; tags pushed to stable

Before touching `stable` or publishing, the formula first verifies that the
current `origin/main` passes local tests, the local CI mirror, and GitHub CI.

The formula publishes every public @apicity/* workspace package in one go:
providers under packages/provider/* plus packages/mcp-server. The package set
is discovered from package manifests so newly added packages ship with the
rest. All ship under one three-part version and the npm `latest` tag.

The `publish` step uses the `NPM_TOKEN` item in the `apicity` 1Password vault
(`op://apicity/NPM_TOKEN/password`) through a temporary npm user config. The
token must have publish access for the `@apicity` scope.

## Variables

| Variable     | Source | Default | Description                                    |
|--------------|--------|---------|------------------------------------------------|
| version      | caller | —       | Three-part semver to publish, e.g. 0.4.1       |
| dry_run      | caller | false   | If "true", stop after publish-dry-run          |
| release_bead | caller | auto    | Tracking bead this release closes; auto-created if blank |
"""
formula = "mol-apicity-release"
version = 1
target_required = false

# Requiring formula_compiler >=2.0.0 compiles this as a v2 graph (Ready-visible workflow
# root). Replaces the deprecated `contract = "graph.v2"`.
[requires]
formula_compiler = ">=2.0.0"

[catalog]
name = "mol-apicity-release"
description = "Cut an Apicity npm release from stable through publish, tagging, GitHub release notes, main sync, smoke install, and release tracking."

[metadata.gc]
workflow = "apicity-release"
run_target = "{{run_target}}"
control_path = "apicity/core.control-dispatcher"

[vars]
[vars.version]
description = "Three-part semver string to publish, e.g. 0.4.1."
required = true

[vars.dry_run]
description = 'If "true", stop after publish-dry-run; do not run real publish or git push.'
default = "false"

[vars.release_bead]
description = "Tracking bead this release closes. Optional: leave blank and the formula reuses (or creates) a deterministic 'Release Apicity vX.Y.Z' bead, then closes it in the final step."
default = ""

[vars.run_target]
description = "Gas City run target for release step execution."
default = "apicity/gc.run-operator"

[[steps]]
id = "release"
title = "Release Apicity: gates, publish, tag, sync, close"
metadata = { "gc.run_target" = "{{run_target}}" }
description = '''
Run the full release in one executable formula step. The first half is
reversible and local: load context, verify the release commit on `main` is
green, fast-forward `stable`, bump every package version, and inspect the
publish tarballs with --dry-run. The second half is irreversible and
outward-facing: publish to npm, tag + push the release commit, create/update
the public GitHub release page, sync `main` back up to `stable`, smoke install,
and close the release tracking bead.

Keeping this as one step avoids the dispatcher handoff that can strand the
release between "prepare" and "release". When `dry_run` = true, the release
ends at the dry-run short-circuit before any publish, tag, or push happens.

Work the sub-steps in order. Each sub-step's STOP conditions and exit
criteria still apply.


# Sub-step 0: Singleton guard — refuse a duplicate concurrent release

This release is a singleton. Two agents once launched the same version's
release in parallel (a near double-publish another agent had to catch and
escalate). Nothing coordinated them. Before doing anything else, prove this is
the only in-progress `mol-apicity-release` run for this rig — and if it isn't,
STOP without touching npm or the remote.

```bash
# Identify our OWN workflow root. The running release step bead is assigned to
# this session and carries gc.root_bead_id (the workflow root) + a step_ref.
self_root=$(bd list --status in_progress --assignee "$GC_SESSION_NAME" --limit 0 --json 2>/dev/null \
  | jq -r '[.[] | select(.metadata."gc.step_ref" == "mol-apicity-release.release")][0].metadata."gc.root_bead_id" // empty')

# All in-progress release WORKFLOW roots for this rig. The workflow root's title
# is exactly "mol-apicity-release"; filter to gc.kind=workflow so fix/feature
# beads that merely mention the formula in their title are excluded.
runs_json=$(bd list --status in_progress --title-contains "mol-apicity-release" --limit 0 --json 2>/dev/null \
  | jq -c '[.[]
      | select(.metadata."gc.kind" == "workflow")
      | select((.metadata."gc.root_store_ref" // "") == "rig:apicity")
      | {id, created_at, version: (.metadata."gc.var.version" // "")}]')

conflict=""
if [ -n "$self_root" ]; then
  # Oldest-wins: abort if any OTHER in-progress run started before us. Exactly
  # one run (the globally oldest) survives, even if two start near-simultaneously.
  conflict=$(printf '%s' "$runs_json" | jq -r --arg self "$self_root" --arg ver "{{version}}" '
    ([.[] | select(.id == $self) | .created_at][0]) as $selfTs
    | if $selfTs == null then empty else
        [ .[] | select(.id != $self) | select(.created_at < $selfTs) ]
        | (map(select(.version == $ver)) + map(select(.version != $ver)))
        | (.[0] // empty)
        | if . == "" or . == null then empty else "\(.id) (version \(.version))" end
      end')
else
  # Fallback: own workflow root not resolvable. Only treat as a conflict when
  # there is clearly more than one in-progress run for THIS version (a lone run
  # must still proceed). Ambiguity → halt rather than risk a double publish.
  dup=$(printf '%s' "$runs_json" | jq -r --arg ver "{{version}}" '[.[] | select(.version == $ver)] | length')
  [ "${dup:-0}" -gt 1 ] && conflict="$dup concurrent runs for v{{version}} (self-id unavailable)"
fi

if [ -n "$conflict" ]; then
  echo "ABORT: another mol-apicity-release run is already in progress: $conflict"
  echo "Refusing to start a duplicate concurrent release (see ac-c98tc)."
  # Leave a breadcrumb on our own workflow root, then halt. Do NOT proceed to any
  # further sub-step and do NOT reach the publish phase. A non-zero exit here
  # keeps npm and the remote untouched.
  [ -n "$self_root" ] && bd update "$self_root" --set-metadata superseded=true \
    --notes "Superseded: a prior mol-apicity-release run ($conflict) is already in progress; this duplicate aborted by the release singleton guard." >/dev/null 2>&1 || true
  gc runtime drain-ack
  exit 1
fi
echo "Singleton guard: this is the only in-progress mol-apicity-release run (root=${self_root:-unknown}). Proceeding."
```

**If the block prints `ABORT`: STOP the entire release here.** Do not run the
remaining release sub-steps and do not enter the publish phase — the conflicting
run is the canonical one and will publish. This run is a no-op.


# Sub-step 1: Load context and verify clean working tree

Initialize the session and verify the repo is in a publishable state.

**1. Prime your environment:**
```bash
bd prime
```

**2. Resolve (or create) the release tracking bead, then read it:**
```bash
release_bead="{{release_bead}}"
if [ -z "$release_bead" ]; then
  # No tracking bead supplied. Reuse an open one for this version if it exists,
  # otherwise create it. The title is deterministic ("Release Apicity vX.Y.Z")
  # so later steps re-resolve the same bead by title -- no ID threading across
  # sessions, and a re-pour reuses the bead instead of duplicating it.
  release_bead=$(bd list --status open --title-contains "Release Apicity v{{version}}" --limit 0 --json 2>/dev/null | jq -r '.[0].id // empty')
  if [ -z "$release_bead" ]; then
    release_bead=$(bd create "Release Apicity v{{version}}" --type task --priority 1 --description "Tracking bead for the @apicity/* v{{version}} npm release (auto-created by mol-apicity-release)." --json | jq -r '.[0].id // .id')
    echo "Auto-created release tracking bead $release_bead"
  else
    echo "Reusing open release tracking bead $release_bead"
  fi
fi
bd show "$release_bead"
cat /Users/jwt/apicity/RELEASE.md   # release process doc (if present)
```

**3. Verify clean working tree:**
```bash
git fetch --all --prune
# bd commands auto-stage .beads/issues.jsonl — commit any pending bead delta first:
git diff --quiet --cached .beads/issues.jsonl || git commit -m "chore(beads): release sync" -- .beads/issues.jsonl
git status --porcelain   # MUST be empty
```

If `git status --porcelain` is non-empty, STOP and mail the mayor — do not
release on top of unstaged work.

**4. Confirm intent:**

You are about to publish every public `@apicity/*` workspace package to the
public npm registry. Once `latest`-tagged versions are out, they cannot be
unpublished after 72h. Read the values:

  - version = {{version}}
  - npm tag = latest
  - dry_run = {{dry_run}}

Validate the version before continuing:

```bash
node -e '
const version = process.argv[1];
if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(version)) {
  console.error(`Release version must be X.Y.Z, got ${version}`);
  process.exit(1);
}
' "{{version}}"
```

**Exit criteria:** Working tree clean, vars confirmed, release bead read.

# Sub-step 2: Verify tests and CI are green on main

Before changing `stable`, bumping versions, or publishing, prove that the exact
`main` commit being released is green.

**1. Update local `main` to match the remote:**
```bash
git checkout main
git pull --ff-only origin main
main_sha=$(git rev-parse origin/main)
test "$(git rev-parse HEAD)" = "$main_sha"
```

If the pull cannot fast-forward, STOP. `main` has local divergence or unpushed
work; do not release until `main` is clean and matches `origin/main`.

**2. Run tests and the local CI mirror on `main`:**
```bash
pnpm install --frozen-lockfile
pnpm run test:run
pnpm run ci:local
```

`ci:local` already includes the replay test suite, but `test:run` is kept here
as an explicit release gate so test failures are visible before the broader CI
mirror runs.

**3. Verify GitHub CI is green for the same `origin/main` SHA:**
```bash
main_sha=$(git rev-parse origin/main)
run_json=$(gh run list --branch main --workflow CI --commit "$main_sha" --limit 1 --json databaseId,status,conclusion,headSha,url)

node -e '
const [run] = JSON.parse(process.argv[1]);
if (!run) {
  console.error("No GitHub CI run found for origin/main");
  process.exit(1);
}
console.log(`${run.status}/${run.conclusion || "-"} ${run.url}`);
if (run.headSha !== process.argv[2]) {
  console.error(`CI run is for ${run.headSha}, expected ${process.argv[2]}`);
  process.exit(1);
}
if (run.status !== "completed" || run.conclusion !== "success") {
  console.error("GitHub CI on main is not green; wait for success or fix main.");
  process.exit(1);
}
' "$run_json" "$main_sha"
```

If the GitHub run is missing, pending, cancelled, or failed, STOP. Do not sync
`stable` and do not publish until CI on `main` is green.

**Exit criteria:** Local `test:run` and `ci:local` pass on `main`, and GitHub
CI reports success for the same `origin/main` commit.

# Sub-step 3: Fast-forward stable and run the CI mirror

Bring `stable` up to the head of `main` so the release reflects the agent
working branch's tip, then mirror exactly what CI runs on the release branch
(`pnpm run ci:local` = build + lint + test:run). A red preflight here means CI
on `stable` will be red — abort the release.

```bash
git checkout stable
git pull --ff-only origin stable
git merge --ff-only origin/main
pnpm install --frozen-lockfile
pnpm run ci:local
```

**If `merge --ff-only` fails:** `stable` has diverged from `main`. STOP. This
is a human decision — either rebase `stable` onto `main` or cherry-pick the
missing commits. Mail the mayor with the divergence summary; do not improvise.

If `ci:local` fails:
  - Investigate the root cause; do NOT release with red tests or a build break.
  - File a bd bug if the failure is pre-existing on stable.
  - If the failure was introduced by main->stable merge, revert the merge
    and STOP.

**Exit criteria:** Local `stable` is at `origin/main` HEAD and
`pnpm run ci:local` exits 0.

# Sub-step 4: Verify publish config and bump every package to {{version}}

Confirm every publishable package has the metadata it needs to ship cleanly,
then create the lockstep version bump release commit.

Use `command grep` (not the alias — many shells alias `grep` to `ugrep` which has different flags) and explicit paths via `find` (not `ls -d`, which is aliased to `eza`/`lsd` in many environments and prints columns, not paths).

```bash
node <<'NODE'
const fs = require("fs");

function readPublishablePackages() {
  const dirs = [
    "packages/mcp-server",
    ...fs
      .readdirSync("packages/provider", { withFileTypes: true })
      .filter((entry) => entry.isDirectory())
      .map((entry) => `packages/provider/${entry.name}`),
  ];

  return dirs
    .filter((dir) => fs.existsSync(`${dir}/package.json`))
    .map((dir) => ({
      dir,
      pkg: JSON.parse(fs.readFileSync(`${dir}/package.json`, "utf8")),
    }))
    .filter(({ pkg }) =>
      pkg.name && pkg.name.startsWith("@apicity/") && pkg.private !== true
    )
    .sort((a, b) => a.pkg.name.localeCompare(b.pkg.name));
}

const pkgs = readPublishablePackages();
let bad = 0;
for (const { dir, pkg } of pkgs) {
  if (!(pkg.publishConfig && pkg.publishConfig.access === "public"))
    { console.log("✗ missing publishConfig.access=public in", dir); bad++; }
  if (!fs.existsSync(`${dir}/LICENSE`))
    { console.log("✗ missing LICENSE in", dir); bad++; }
}
if (bad === 0) console.log(`✓ all ${pkgs.length} packages publish-ready`);
process.exit(bad === 0 ? 0 : 1);
NODE
```

If any of these fail, the prep work was not completed. STOP. File a bug
referencing the parent epic and abort the release — pour again once prep is
green.

Bump in lockstep — every public `@apicity/*` package ships under one version. Don't use
`pnpm -r exec npm version` here — it implicitly runs `npm install`, which
trips on the optional zod peer dep. Direct JSON write is simpler and
deterministic:

```bash
node <<'NODE'
const fs = require("fs");

function readPublishablePackageJsonPaths() {
  const dirs = [
    "packages/mcp-server",
    ...fs
      .readdirSync("packages/provider", { withFileTypes: true })
      .filter((entry) => entry.isDirectory())
      .map((entry) => `packages/provider/${entry.name}`),
  ];

  return dirs
    .map((dir) => `${dir}/package.json`)
    .filter((p) => fs.existsSync(p))
    .filter((p) => {
      const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
      return (
        pkg.name && pkg.name.startsWith("@apicity/") && pkg.private !== true
      );
    })
    .sort((a, b) => {
      const aPkg = JSON.parse(fs.readFileSync(a, "utf8"));
      const bPkg = JSON.parse(fs.readFileSync(b, "utf8"));
      return aPkg.name.localeCompare(bPkg.name);
    });
}

const packageJsonPaths = readPublishablePackageJsonPaths();
for (const p of packageJsonPaths) {
  const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
  pkg.version = "{{version}}";
  fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
}
const wrong = packageJsonPaths.filter(p => JSON.parse(fs.readFileSync(p, "utf8")).version !== "{{version}}");
if (wrong.length) { console.log("WRONG:", wrong); process.exit(1); }
console.log(`✓ all ${packageJsonPaths.length} at {{version}}`);
NODE
```

**Commit the bump:**
```bash
git add packages/mcp-server/package.json packages/provider/*/package.json
git commit -m "chore(release): @apicity/* → {{version}}"
```

**Exit criteria:** Every public `@apicity/*` package passes publish-ready
checks, every manifest is at `{{version}}`, and the release bump is committed.

# Sub-step 5: Inspect tarballs with --dry-run (dry_run stops here)

Preview every tarball before sending real bytes. This catches:
  - tarballs that ship `tests/recordings/` (they shouldn't — `files` is dist-only)
  - missing `dist/`, `README.md`, or `LICENSE`
  - secrets accidentally left in source
  - mcp-server's `bin.js` not present or missing shebang

```bash
pnpm -r --filter "@apicity/*" publish --dry-run --tag latest --no-git-checks 2>&1 | tee /tmp/apicity-dry-run.log
```

**Sanity-check the log manually:**

  - For each package, the tarball lists `dist/...`, `README.md`,
    `LICENSE`, and `package.json` — and nothing else. No `tests/`, no
    `.env*`, no `*.har` recordings.
  - File counts and total size look reasonable (anything >10MB is suspicious).
  - For `@apicity/mcp-server`, the `dist/src/bin.js` entry is present.

If anything looks off, STOP. Investigate before publishing for real.

**If dry_run = "true": STOP HERE.** Do not proceed to the publish step.
Mail the mayor with the dry-run log path and exit. The release ends on a
dry-run when {{dry_run}} = true.

```bash
[ "{{dry_run}}" = "true" ] && { echo "dry_run=true → stopping after dry-run"; gc runtime drain-ack; exit 0; } || true
```

**Exit criteria:** Dry-run exits 0, every tarball inspected, ready to publish for real.

# Sub-step 6: Publish to npm

Publish with the npm token stored in 1Password. Do not write the token to the
repo, shell history, or logs.

**1. Verify token access and auth:**
```bash
op read 'op://apicity/NPM_TOKEN/password' >/dev/null

tmp_npmrc=$(mktemp)
cleanup() { rm -f "$tmp_npmrc"; }
trap cleanup EXIT
npm_token=$(op read 'op://apicity/NPM_TOKEN/password')
printf 'registry=https://registry.npmjs.org/
//registry.npmjs.org/:_authToken=%s
' "$npm_token" > "$tmp_npmrc"
NPM_CONFIG_USERCONFIG="$tmp_npmrc" npm whoami   # MUST print the publishing account
NPM_CONFIG_USERCONFIG="$tmp_npmrc" npm config get registry
```

If `op read` or `npm whoami` errors, STOP. Fix 1Password access or the
`NPM_TOKEN` item before publishing.

**2. Publish all public `@apicity/*` packages:**
```bash
NPM_CONFIG_USERCONFIG="$tmp_npmrc" pnpm -r --filter "@apicity/*" publish --tag latest --no-git-checks
```

`--no-git-checks` is required because we're publishing from a release commit
that may not yet have an upstream tag (the next step handles that).

**3. Verify on the registry:**
```bash
npm view @apicity/openai dist-tags    # expect latest: {{version}}
npm view @apicity/mcp-server dist-tags
```

If publish fails partway through (network, auth lapse), some packages may
already be live. STOP. Resume by re-running `pnpm publish` for only the
packages that didn't get through with the same `NPM_CONFIG_USERCONFIG`
environment. npm rejects re-publishing the same version, so it's safe to retry
the whole filter.

**Exit criteria:** Every public `@apicity/*` package is visible at `{{version}}` under `latest`.

# Sub-step 7: Tag, push, and update the GitHub release

Annotate the release commit, propagate it to the remote, and create or update
the public GitHub release page for the pushed `v{{version}}` tag.

**1. Tag and push the release commit (idempotent):**

A retried release (publish succeeded but a later sub-step failed) must not error
on an already-existing tag. Create the tag only when missing, and treat an
already-pushed tag as success.

`stable` is protected by the `stable-release-only` GitHub ruleset: normal
pushes are rejected, and only the release deploy key
(`/gc/.gc/secrets/apicity-stable-deploy-key`) bypasses it. Push `stable`
through that key; the tag is not restricted and pushes over `origin` as usual.
```bash
if git rev-parse -q --verify "refs/tags/v{{version}}" >/dev/null; then
  echo "Tag v{{version}} already exists locally — skipping creation."
else
  git tag -a v{{version}} -m "Release Apicity v{{version}}"
fi
GIT_SSH_COMMAND="ssh -i /gc/.gc/secrets/apicity-stable-deploy-key -o IdentitiesOnly=yes -o UserKnownHostsFile=/gc/.gc/secrets/github-known-hosts -o StrictHostKeyChecking=accept-new" \
  git push git@github.com:justintanner/apicity.git stable
git push origin v{{version}} || echo "Tag v{{version}} already on origin — continuing."
```

**2. Verify GitHub CLI auth:**
```bash
gh auth status
```

If `gh auth status` fails, STOP. Fix GitHub CLI authentication before
continuing; do not skip the release page.

**3. Build release notes from the release commit range:**
```bash
release_bead="{{release_bead}}"
if [ -z "$release_bead" ]; then
  release_bead=$(bd list --title-contains "Release Apicity v{{version}}" --limit 0 --json 2>/dev/null | jq -r '.[0].id // empty')
fi
notes="/tmp/apicity-github-release-v{{version}}.md"
# --beads defaults to off: the commit range is the only source. Add
# --beads=enrich (optionally --release-bead "$release_bead") only for the
# uninformative-subject case described below.
if ! node scripts/release-notes.mjs --version {{version}} > "$notes"; then
  echo "release-notes generation failed — do not publish the release page." >&2
  rm -f "$notes"
  exit 1
fi
cat "$notes"
```

The commit range `<previousTag>..v{{version}}` is the only source of the
`New` and `Updated` sections by default (`--beads=off`). Beads are a
secondary, opt-in source: `--beads=enrich` additionally pulls beads closed in
the same window that carry no `gc.*` workflow metadata, and exists for release
windows whose commit subjects are too terse to describe the release on their
own. Reach for it only in that case — it queries a live bead store, so its
output is not reproducible run to run the way the default path is.

A non-zero exit means the range yielded nothing publishable. `$notes` is
removed and nothing reaches stdout, so there is no empty-section page to
publish: stop here, work out why the range is empty (usually a missing tag or
a shallow clone — the stderr diagnostic says which), and do not create or edit
the release page.

Review the generated file before uploading it. It should read like a user
changelog: a `New` section, an `Updated` section (either omitted when empty),
then `Published Packages`. Each line is a short, human-readable description with
NO internal details — no bead IDs, no `P0`/`P1` priorities, no close-reason
boilerplate, no `(`ac-xxxx`, P1)` suffixes. It should not include release
metadata, `Summary`, `Released Work`, `What's Changed`, or `Release Maintenance`
headings.

**4. Create or update the release page:**
```bash
if gh release view "v{{version}}" >/dev/null 2>&1; then
  gh release edit "v{{version}}" --title "v{{version}}" --notes-file "$notes" --latest
else
  gh release create "v{{version}}" --verify-tag --title "v{{version}}" --notes-file "$notes" --latest
fi
gh release view "v{{version}}"
```

**Exit criteria:** `origin/stable` is up to date, `v{{version}}` is pushed,
and the GitHub release page exists with current bead-based notes marked as the
latest release.

# Sub-step 8: Fast-forward main and smoke install

Propagate the release version bump back to `main` so `main` and `stable` do
not drift after publishing, then verify a fresh consumer install resolves the
published artifact and the entrypoint loads. The checkout ends on `main` and
must stay there: the rig checkout is shared by every subsequent work session,
and `stable` only moves during a release. (Leaving the checkout on `stable`
here is what caused work commits to land on `stable` after v0.8.2.)

```bash
git checkout main
git pull --ff-only origin main
git merge --ff-only stable
git push origin main
```

**If `merge --ff-only` fails:** `main` has moved since the release started.
STOP and mail the mayor with the divergence summary. Do not create a merge
commit or cherry-pick without an explicit decision.

```bash
SMOKE=$(mktemp -d)
cd "$SMOKE"
npm init -y >/dev/null
npm install @apicity/openai@latest
node -e 'import("@apicity/openai").then(m => console.log("✓ exports:", Object.keys(m).slice(0, 5)))'
cd - >/dev/null
rm -rf "$SMOKE"
```

If the install fails or the dynamic import throws, the published tarball is
broken. STOP and mail the mayor — `npm deprecate` may be needed for this
version before the next release.

**Exit criteria:** `origin/main` and `origin/stable` point at the release
commit, the working branch ends on `main`, and the smoke install + import
succeed.

# Sub-step 9: Close the release bead

Record the release in beads memory and close the tracking bead.

```bash
release_bead="{{release_bead}}"
if [ -z "$release_bead" ]; then
  release_bead=$(bd list --title-contains "Release Apicity v{{version}}" --limit 0 --json 2>/dev/null | jq -r '.[0].id // empty')
fi
bd close "$release_bead" --reason "Published Apicity v{{version}} on npm latest; tag v{{version}} pushed; origin/main and origin/stable synced to release commit"
bd remember --key apicity-last-release "version={{version}} tag=v{{version}} npm_tag=latest release_bead=$release_bead released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
```

**Drain:**
```bash
gc runtime drain-ack
```

**Exit criteria:** Release bead closed, drain acknowledged.'''
