version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    # Disable Dependabot version-update PRs while keeping this config present.
    open-pull-requests-limit: 0
    # Ignore every dependency so security-update PRs are not generated.
    # Dependabot alerts/security warnings are controlled separately in GitHub.
    ignore:
      - dependency-name: "*"
