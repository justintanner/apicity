name: CI

on:
  push:
    branches: "**"
  pull_request:
    branches: "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Defense-in-depth: lint and tests run against source, never dist, so they
      # must not trigger a build. The prelint / pretest:run hooks that used to
      # rebuild everything were removed; this keeps it that way if a pre/post
      # hook is ever reintroduced.
      npm_config_enable_pre_post_scripts: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The release-notes regression test renders v0.8.3..v0.8.4 from real
      # history. Fetch just those two tags instead of putting `fetch-depth: 0`
      # on this job: the pack is ~939 MiB and this job runs on every push and
      # PR, while the fetch below moves 187 objects / ~22 KiB.
      #
      # depth=6, not 1: measured in a shallow clone, `--depth=1` lands both
      # tagged commits as shallow roots, so `git log v0.8.3..v0.8.4` walks 1
      # commit instead of 5. The window is 5 commits, and depth 6 also pulls
      # v0.8.3's commit as v0.8.4's sixth ancestor, so the two tags are
      # genuinely connected (`git merge-base --is-ancestor` succeeds). Depth 5
      # prints the right 5 commits only because the two tags truncate into
      # disjoint graphs — correct by coincidence, not by ancestry.
      - name: Fetch release-notes regression tags
        run: |
          git fetch --no-tags --depth=6 origin \
            +refs/tags/v0.8.3:refs/tags/v0.8.3 \
            +refs/tags/v0.8.4:refs/tags/v0.8.4
          git rev-parse -q --verify refs/tags/v0.8.3
          git rev-parse -q --verify refs/tags/v0.8.4
          git merge-base --is-ancestor v0.8.3 v0.8.4

      # CI replays cassettes only. Re-recording is a deliberate, local-only act
      # behind `pnpm run dev:record` / `dev:rerecord`; never let it run in CI.
      - name: Guard against cassette re-recording
        run: |
          if [ "${POLLY_MODE:-replay}" != "replay" ]; then
            echo "::error::POLLY_MODE=$POLLY_MODE in CI — cassette re-recording is forbidden; CI must replay only."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run audit

      - name: Verify generated examples are current
        run: pnpm run gen:examples:check

      # Must run BEFORE the build: `pnpm run build` ends in `doc-gen`, which
      # rewrites the very files this step inspects, so a check placed after it
      # would compare regenerated output against itself and pass on a stale
      # commit every time.
      - name: Verify generated provider READMEs are current
        run: pnpm run doc-gen:check

      - name: Build packages
        run: pnpm run build

      - name: Verify provider artifacts
        run: |
          test -f packages/provider/kimicoding/dist/src/index.js
          test -f packages/provider/kimicoding/dist/src/index.d.ts
          test -f packages/provider/kie/dist/src/index.js
          test -f packages/provider/kie/dist/src/index.d.ts
          test -f packages/provider/alibaba/dist/src/index.js
          test -f packages/provider/alibaba/dist/src/index.d.ts

      # Type-check the whole tests/ tree (tests/tsconfig.json). The build step
      # above only tsc's packages/**, and test:run executes rather than
      # type-checks the vitest suite, so without this a test-only type
      # regression stays latent until someone runs `pnpm run typecheck`.
      - name: Typecheck (tests)
        run: pnpm run typecheck:tests

      # Endpoint & factory signature conventions are enforced by `pnpm run lint`
      # (lint:signatures + lint:factory in lint:repo).
      - name: Lint
        run: pnpm run lint

      - name: Integration tests (replay)
        run: pnpm run test:run

  endpoint-telegram:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Send endpoint summaries to Telegram
        env:
          TELEGRAM_BOT_KEY: ${{ secrets.TELEGRAM_BOT_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          fi

          pnpm run harness:telegram -- \
            --dry-run \
            --base "$base" \
            --out harness-telegram-messages.json

          message_count=$(node -e 'const fs = require("node:fs"); const messages = JSON.parse(fs.readFileSync("harness-telegram-messages.json", "utf8")); console.log(messages.length);')
          if [ "$message_count" = "0" ]; then
            echo "No endpoint Telegram messages to send."
            exit 0
          fi

          if [ -z "$TELEGRAM_BOT_KEY" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Telegram secrets are not configured for $message_count endpoint message(s)."
            exit 1
          fi

          pnpm run harness:telegram -- --base "$base"
